<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <form method="get" enctype="multipart/form-data" action="recibirfor.html">

<title>Documento sin título</title>
</head>


<body>
    <title>Decohohar</title>
    
    
<style>
        
            padding: 50px;
            background-color: #39396C; 
        
        .caja-formulario {
            background-color:#130B60;
            padding: 30px;
            border: 2px solid #333; /* Borde sólido simple */
            border-radius: 10px;
            max-width: 500px;
            margin: 0 auto;
        }

        h2 {
            color: #d63384; /* Un rosa/fucsia para que resalte */
            text-align: center;
        }
    </style>
<body>

<div class="caja-formulario">
    <h2>Formulario </h2>
    <hr>

    <div class="form-check form-switch mb-3">
        <input class="form-check-input" type="checkbox" id="activador">
        <label class="form-check-label" for="activador"><b>¿deseas registrarte?</b></label>
    </div>

<form>
        <fieldset id="campos" disabled>
          <div class="mb-3">
                <label class="form-label">Nombre:</label>
                <input type="text" class="form-control" placeholder="Escribe tu nombre">
                <label class="form-label">Apellido:</label>
                <input type="text" class="form-control" placeholder="Escribe tu apellido">
          </div>
            <div class="mb-3">
                <label class="form-label">Fecha de nacimiento:</label>
                <input type="date" class="form-control" placeholder="Escribe tu fecha de nacimiento">
                 <div class="mb-3">
                <label class="form-label">Cedula:</label>
                <input type="text" class="form-control" placeholder="Escribe tu numero de cedula">
                 <div class="mb-3">
                <label class="form-label">Direccion:</label>
                <input type="text" class="form-control" placeholder="Escribe tu direccion">
            </div>
             <div class="mb-3">
                <label class="form-label">como supiste de nosotros?:</label>
                <input type="text" class="form-control" placeholder="Responde">
          </div>
                            
            <div class="mb-3 form-check">
                <input type="checkbox" class="form-check-input" id="check1">
                <label class="form-check-label" for="check1">Acepto los términos</label>
           <div>
    <input type="submit" id="b_guardar" name="b_guardar" value="ENVIAR"/>
    <a href="chekin-decohogar.html"><input type="button" id="b_nuevo" name="b_nuevo" value="NUEVO" /></a>
    
        </fieldset>
  </form>


<script>
   
    const miSwitch = document.getElementById('activador');
    const misCampos = document.getElementById('campos');

  
    miSwitch.onclick = function() {
        if (miSwitch.checked) {
            misCampos.disabled = false; 
        } else {
            misCampos.disabled = true;  
        }
    }
</script>
</body>

</html>
